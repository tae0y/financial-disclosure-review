# A small stand-in for the real case corpus. Four cases, chosen to cover the paths the tests
# need: two product types that overlap on one case, one 유추 case, and one case whose
# related_checklist has a 표시/쉬운말 code rather than a card-rubric code.
items:
- case_id: case.test_revolving_min_rate
  record_type: 지적사례
  institution: 금융감독원
  firm: not_disclosed
  official_date: '2024-02-26'
  official_primary_url: https://example.test/revolving-rate
  source_tier: 1
  product_types:
  - 리볼빙
  product_basis: 직접
  product_subtype: 결제성 리볼빙
  legal_basis: 금융소비자보호법 제22조
  issue: 리볼빙 광고가 평균이자율 없이 최소이자율만 첫 화면에 표기했습니다.
  outcome: 개선방안 시행
  mvp_signal: 첫 화면 이자율 표기, 평균 이자율 병행 여부
  page_only_detectability: full
  related_checklist:
  - C03
  - E08
  text: |
    평균 이자율 언급 없이 최소 및 최대 이자율 범위만 안내하고, 광고 첫 화면에 일반 소비자가
    적용받기 어려운 최소이자율만 표기하여 소비자의 올바른 의사결정을 저해.
  retrieved_at: '2026-09-27'

