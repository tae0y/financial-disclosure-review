  - 리볼빙
  - 신용카드
  product_basis: 직접
  product_subtype: 결제성 리볼빙
  legal_basis: 여신전문금융회사 등의 광고에 관한 규정 세부지침
  issue: 가입화면 안내문의 글자 크기가 작고 모두 검은색이어서 중요사항을 구별할 수 없었습니다.
  outcome: 개선방안 시행
  mvp_signal: 안내문 글자 크기와 색상, 경고문구의 굵기와 음영
  page_only_detectability: full
  related_checklist:
  - 표시04
  - 표시06
  text: |
    리볼빙 가입화면 안내문의 글자 크기가 작거나 모두 검은색으로 기재되어 중요사항에 대해
    금융소비자가 명확히 인지하지 못할 우려.
  retrieved_at: '2026-09-27'

- case_id: case.test_card_benefit_condition
  record_type: 지적사례
  institution: 금융감독원
  firm: not_disclosed
  official_date: '2024-10-07'
  official_primary_url: https://example.test/card-benefit
  source_tier: 1
  product_types:
  - 신용카드
  product_basis: 직접
  product_subtype: 무이자할부 서비스
  legal_basis: 금융소비자보호법 제19조
  issue: 무이자할부 이용 시 포인트 적립이 제외되는 조건을 안내하지 않았습니다.
  outcome: 안내 보완 추진
  mvp_signal: 실적 제외·포인트 미적립 문구와 혜택 문구의 거리
  page_only_detectability: full
  related_checklist:
  - A10
  - D06
  - 쉬운말07
  text: |
    무이자할부를 이용할 경우 실적 산정, 포인트 적립 및 할인 등이 제외되는 조건임에도 이를
    홈페이지 또는 홍보물을 통해 안내하지 않고 있어 혜택을 비교·선택하기 어렵다.
  retrieved_at: '2026-09-27'

- case_id: case.test_loan_eligibility
  record_type: 위반사례
  institution: 공정거래위원회
  firm: (주)테스트크레디트
  official_date: '2008-02-25'
  official_primary_url: https://example.test/loan-eligibility
  source_tier: 1
  product_types:
  - 장기카드대출
  product_basis: 유추
  product_subtype: 대부업 소비자금융 대출
  legal_basis: 표시·광고의 공정화에 관한 법률 제3조제1항제1호
  issue: 대출 거절 요건이 있는데 특정 연령대 누구에게나 대출해 주는 것처럼 광고했습니다.
  outcome: 시정명령, 과징금
  mvp_signal: "'누구나' 같은 자격 표현, 연소득·개인신용평점 제한의 표시 여부"
  page_only_detectability: full
  related_checklist:
  - B01
  - D12
  text: |
    일정한 대출거절요건에 해당하는 고객에게는 대출을 불허함에도 불구하고, 마치 특정 연령대의
    모든 소비자에게 대출을 허용해주는 것처럼 광고하는 행위.
  retrieved_at: '2026-09-27'
