[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[project]
name = "financial-disclosure-review"
version = "0.1.0"
description = "Financial product page review (explanation duty, display method) and plain-language conversion as one LangGraph app"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12",
    "langchain-core==1.6.3",
    "langchain-openai==1.6.2",
    "langgraph==1.2.11",
    "openai==3.13.0",
    "pydantic==2.13.5",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "jupyter>=1.1.1",
    "notebook>=7.6.2",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "sqlite-vec==0.1.9",
    "playwright>=1.63.0",
    "fastapi>=0.121.0",
    "uvicorn[standard]>=0.40.0",
    "httpx>=0.28.1",
    "duckdb>=1.5.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.8",
    "pyright>=1.1",
    "nbformat>=5.11.1",
    "nbclient>=0.11.0",
    "ipykernel>=7.3.0",
    "pytest-asyncio>=1.3.0",
]

[tool.uv]
package = true

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101"]

[tool.pyright]
exclude = ["scratchpad", ".venv", ".claude"]
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
reportMissingTypeStubs = "warning"
reportUnknownParameterType = "warning"
reportUnknownArgumentType = "warning"
reportUnknownMemberType = "warning"

[tool.ruff]
line-length = 100
target-version = "py312"
# 판정 대상이 아닌 트리는 제외합니다. notebooks/는 src 이전 후 삭제 대기 상태이고,
# .claude/는 외부에서 받아온 도구 모음입니다. 게이트는 src·tests 범위입니다.
extend-exclude = ["notebooks", ".claude", "scratchpad", "localdocs"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = []

[tool.ruff.lint.per-file-ignores]
# Prompt text is copied verbatim; rewrapping it would change what the model reads.
"src/financial_disclosure_review/domain/*/prompts.py" = ["E501"]
"src/financial_disclosure_review/domain/product_page/discover.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "use_llm: calls a real LLM (costs money)",
    "use_network: opens external sites",
]
addopts = "-m 'not use_llm and not use_network'"


