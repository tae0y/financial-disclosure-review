info:
  description: "Reviews a Korean financial-product web page against the explanation duty (설명의무) and the\n\
    display-method rules (표시방법), and rewrites its explanation in plain Korean.\n\n**A review takes minutes,\
    \ so nothing here returns one.** The page is rendered in a real browser and\njudged over a series\
    \ of model calls. Cloudflare closes a response that has produced nothing for\nabout 100 seconds, so\
    \ a synchronous endpoint would fail on exactly the runs that worked.\n\nSubmitting therefore returns\
    \ `202 Accepted` with a job id; poll `GET /v1/reviews/{job_id}` until\n`status` leaves `queued`/`running`.\
    \ Job rows are stored on disk, so a restart does not lose the\nrecord of what was asked.\n\n`status`\
    \ reaches one of:\n\n- `succeeded` — `result` is filled.\n- `failed` — the worker raised; `error`\
    \ holds the type and message.\n- `interrupted` — the gateway restarted mid-run. The partial run's\
    \ checkpoints survive, so\n  `POST /v1/reruns` resumes it instead of starting over.\n"
  title: Financial Disclosure Review API
  version: 0.1.0
openapi: 3.1.0
paths:
  /healthz:
    get:
      description: Liveness of the gateway alone, so the container probe never fails on the worker.
      operationId: getHealth
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: Successful Response
      summary: Healthz
      tags:
      - health
  /readyz:
    get:
      description: Readiness including the worker, for a caller deciding whether to submit.
      operationId: getReadiness
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: Successful Response
      summary: Readyz
      tags:
      - health
  /v1/reruns:
    post:
      description: Queue a re-run of a recorded thread from one node onward.
      operationId: submitRerun
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RerunRequest'
        required: true
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobAccepted'
          description: Queued. Poll the `poll` path until the job reaches a terminal status.
        '401':
          description: 'The `Authorization: Bearer <token>` header is missing, malformed or wrong.'
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Submit Rerun
      tags:
      - reviews
  /v1/reviews:
    get:
      description: Recent jobs, newest first.
      operationId: listReviews
      parameters:
      - in: query
        name: limit
        required: false
        schema:
          default: 50
          maximum: 200
          minimum: 1
          title: Limit
          type: integer
      - in: query
        name: status
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/JobStatus'
          - type: 'null'
          title: Status
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobList'
          description: Successful Response
        '401':
          description: 'The `Authorization: Bearer <token>` header is missing, malformed or wrong.'
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: List Reviews
      tags:
      - reviews
    post:
      description: Queue a review of one product page URL.
      operationId: submitReview
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewRequest'
        required: true
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobAccepted'
          description: Queued. Poll the `poll` path until the job reaches a terminal status.
        '401':
          description: 'The `Authorization: Bearer <token>` header is missing, malformed or wrong.'
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Submit Review
      tags:
      - reviews
  /v1/reviews/{job_id}:
    get:
      description: One job. `result` is filled once `status` is `succeeded`.
      operationId: getReview
      parameters:
      - in: path
        name: job_id
        required: true
        schema:
          title: Job Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
          description: Successful Response
        '401':
          description: 'The `Authorization: Bearer <token>` header is missing, malformed or wrong.'
        '404':
          description: No job with that id.
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Get Review
      tags:
      - reviews
  /v1/reviews/{job_id}/report.md:
    get:
      description: The reviewer-facing report as Markdown, once the job has succeeded.
      operationId: getReviewReportMarkdown
      parameters:
      - in: path
        name: job_id
        required: true
        schema:
          title: Job Id
          type: string
      responses:
        '200':
          content:
            text/markdown:
              schema:
                type: string
            text/plain:
              schema:
                type: string
          description: The report as Markdown.
        '401':
          description: 'The `Authorization: Bearer <token>` header is missing, malformed or wrong.'
        '404':
          description: No job with that id.
        '409':
          description: The job has not succeeded, so there is no report yet.
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Get Report Markdown
      tags:
      - reviews
servers:
- description: Local, via the compose override file.
  url: http://localhost:8000
- description: Through the Cloudflare tunnel.
  url: https://{hostname}
  variables:
    hostname:
      default: disclosure-review.example.com
      description: The public hostname routed to api:8000 by the tunnel.
tags:
- description: Submitting a review and reading it back. Every route here requires `X-API-Key` once `FDR_API_KEYS`
    is set.
  name: reviews
- description: Always unauthenticated, so a container probe needs no credential. `/healthz` is liveness
    of this process alone; `/readyz` also reports the worker, the reference DB and the model key.
  name: health
