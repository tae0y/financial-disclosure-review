  applies_condition: 신용카드 발급(신규 가입)을 조건으로 경품·캐시백·연회비 면제 등 경제적 이익을 제공하는 경우. 평균연회비는 1만원(여신전문금융업감독규정 제24조의2).
  binding: 법령
  criterion: "신용카드 발급을 조건으로 제공하는 경제적 이익(경품·캐시백·연회비 면제 등)은 그 카드 연회비(연회비가 1만원 미만이면 1만원)의 100%를 넘어서는 안 됩니다. 발급을 조건으로 제공하는 경제적 이익이 그 카드 연회비(1만원 미만이면 1만원)를 넘는가?"
  sources:
  - doc: yeojeon
    loc: 제14조제4항
    quote: "신용카드업자는 다음 각 호의 방법으로 신용카드회원을 모집하여서는 아니 된다."
    snapshot: 원문 스냅샷/yeojeon.txt
    official_url: https://www.law.go.kr/LSW/lsInfoR.do?lsiSeq=277267&chrClsCd=010202&urlMode=lsInfoP&efYd=20251001&ancYnChk=0
  - doc: yeojeon_decree
    loc: 제6조의7제5항제1호
    quote: "1. 신용카드 발급과 관련하여 그 신용카드 연회비(연회비가 주요 신용카드의 평균연회비 미만인 경우에는 해당 평균연회비를 말한다)의 100분의 100을 초과하는 경제적 이익을 제공하거나 제공할 것을 조건으로 하는 모집"
    snapshot: 원문 스냅샷/yeojeon_decree.txt
    official_url: https://www.law.go.kr/LSW/lsInfoR.do?lsiSeq=285799&chrClsCd=010202&urlMode=lsInfoP&efYd=20260506&ancYnChk=0
  - doc: yeojeon_decree
    loc: 제6조의7제6항
    quote: "제5항제1호의 평균연회비, 제2호의 길거리의 범위, 제3호 단서의 사전동의 절차 및 사업장의 범위에 관한 사항은 금융위원회가 정하여 고시한다."
    snapshot: 원문 스냅샷/yeojeon_decree.txt
    official_url: https://www.law.go.kr/LSW/lsInfoR.do?lsiSeq=285799&chrClsCd=010202&urlMode=lsInfoP&efYd=20260506&ancYnChk=0
  - doc: yeojeon_rule
    loc: 제24조의2
    quote: "시행령 제6조의7제5항제1호의 평균연회비는 1만원으로 한다."
    snapshot: 원문 스냅샷/yeojeon_rule.txt
    official_url: https://www.law.go.kr/LSW/admRulInfoR.do?admRulSeq=2100000279156&chrClsCd=010201
