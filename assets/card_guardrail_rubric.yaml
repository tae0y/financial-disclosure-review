  page_types:
  - 상품광고
  - 업무광고
  applies_condition: null
  binding: 법령
  criterion: "카드사 광고는 금융상품(카드·대출상품)의 명칭을 표시해야 합니다. 금융상품(카드·대출상품)의 명칭이 표시되어 있는가?"
  sources:
  - doc: kfcpa_decree
    loc: 제18조제1항제1호가목
    quote: "1. 금융상품의 내용: 다음 각 목의 사항 가. 금융상품의 명칭"
    snapshot: 원문 스냅샷/kfcpa_decree.txt
    official_url: https://www.law.go.kr/LSW/lsInfoR.do?lsiSeq=285715&chrClsCd=010202&urlMode=lsInfoP&efYd=20260428&ancYnChk=0
  - doc: crefia_reg
    loc: 제4조제1항제2호가목
    quote: "2. 금융상품의 내용으로 다음 각 목의 사항 가. 금융상품의 명칭"
    snapshot: 원문 스냅샷/crefia_reg.txt
    official_url: https://m.crefia.or.kr/mobile/infocenter/regulation/selfRegulation.xx
- code: A04
  group: A. 광고 공통 의무표시
  applies_to:
  - 신용카드
  - 단기카드대출
  - 장기카드대출
  - 리볼빙
  - 할부금융·리스
  page_types:
  - 상품광고
  - 업무광고
  applies_condition: 업무광고는 현금서비스·리볼빙처럼 이자율 범위 등을 기재할 수 있는 서비스를 광고하는 경우에만 적용(협회 세부지침 제3조제1항·제2항). 상품광고는 항상 적용.
  binding: 법령
  criterion: "카드사 광고는 이자율(연체이자율 포함)을 표시해야 합니다. 이자율(연체이자율 포함)이 표시되어 있는가?"
  sources:
  - doc: kfcpa_decree
    loc: 제18조제1항제1호나목
    quote: "이자율(「대부업 등의 등록 및 금융이용자 보호에 관한 법률」 제9조제1항에 따른 대부이자율 및 연체이자율을 포함한다)"
    snapshot: 원문 스냅샷/kfcpa_decree.txt
    official_url: https://www.law.go.kr/LSW/lsInfoR.do?lsiSeq=285715&chrClsCd=010202&urlMode=lsInfoP&efYd=20260428&ancYnChk=0
  - doc: crefia_reg
    loc: 제4조제1항제2호나목
    quote: "나. 이자율(대부업법 제9조제1항에 따른 대부이자율, 연체이자율 포함)"
    snapshot: 원문 스냅샷/crefia_reg.txt
    official_url: https://m.crefia.or.kr/mobile/infocenter/regulation/selfRegulation.xx
  - doc: crefia_guide
    loc: 별표1 1) 제2호②
    quote: "대부업법 제9조제1항에 따른 대부이자율 및 연체이자율 포함"
    snapshot: 원문 스냅샷/crefia_guide.txt
    official_url: https://m.crefia.or.kr/mobile/infocenter/regulation/selfRegulation.xx
  - doc: crefia_reg
    loc: 제4조제3항
    quote: "제1항에도 불구하고 제2조제1항제1호나목의 업무광고는 세부지침에서 정하는 일부 의무표시사항을 포함하지 않을 수 있다."
    snapshot: 원문 스냅샷/crefia_reg.txt
    official_url: https://m.crefia.or.kr/mobile/infocenter/regulation/selfRegulation.xx
  - doc: crefia_guide
    loc: 제3조제1항
    quote: "규정 제4조제1항 및 제2항의 의무표시사항 중 이자율, 수수료 등 특정 금융상품에 관한 의무표시사항을 말한다."
    snapshot: 원문 스냅샷/crefia_guide.txt
    official_url: https://m.crefia.or.kr/mobile/infocenter/regulation/selfRegulation.xx
  - doc: crefia_guide
    loc: 제3조제2항
    quote: "단기카드대출(현금서비스), 리볼빙(일부결제금액이월약정) 서비스와 같이 이자율의 범위표시 등 특정 금융서비스의 정보를 기재 가능한 경우에는 해당되는 의무표시사항을 반영하여야 한다."
    snapshot: 원문 스냅샷/crefia_guide.txt
    official_url: https://m.crefia.or.kr/mobile/infocenter/regulation/selfRegulation.xx
  - doc: fsc_ad_guideline
    loc: Ⅱ. 관련 주요 질의·답변 4
    quote: "신용카드 현금서비스, 리볼빙 서비스는 금융상품이 아니며, 신용카드에 일반적으로 제공되는 서비스에 해당하므로 관련 광고는 “업무광고”에 해당"
    snapshot: 원문 스냅샷/fsc_ad_guideline.txt
    official_url: https://www.fsc.go.kr/no010101/76045
