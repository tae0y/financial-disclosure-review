    loc: 제5조제4항제4호
    quote: "카드사가 카드 사용 금액의 할인 혜택만을 광고하고, 제한 조건에 대해서는 금융소비자가 쉽게 알아볼 수 있도록 조치하지 않은 등 미흡하게 표시하는 행위"
