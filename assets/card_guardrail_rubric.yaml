  - 업무광고
  applies_condition: null
  binding: 법령
  criterion: "카드사 광고는 여신금융회사(카드사)의 명칭을 표시해야 합니다. 카드사(여신금융회사)의 명칭이 표시되어 있는가?"
  sources:
  - doc: kfcpa
    loc: 제22조제3항제2호
    quote: "금융상품판매업자등의 명칭, 금융상품의 내용"
    snapshot: 원문 스냅샷/kfcpa.txt
    official_url: https://www.law.go.kr/LSW/lsInfoR.do?lsiSeq=277247&chrClsCd=010202&urlMode=lsInfoP&efYd=20260102&ancYnChk=0
  - doc: crefia_reg
    loc: 제4조제1항제1호
    quote: "1. 여신금융회사 등의 명칭"
    snapshot: 원문 스냅샷/crefia_reg.txt
    official_url: https://m.crefia.or.kr/mobile/infocenter/regulation/selfRegulation.xx
- code: A03
  group: A. 광고 공통 의무표시
  applies_to:
