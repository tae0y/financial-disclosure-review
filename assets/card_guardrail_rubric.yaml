# 카드사 광고 가드레일 루브릭 (A-G군, 78항목)
#
# 법령·시행령·감독규정·협회 규정/세부지침·금융위 가이드라인에서 뽑은 판단기준입니다.
# 항목마다 적용대상(applies_to·page_types·applies_condition), 판단기준(criterion),
# 원문 인용문·확인 경로(sources[].quote·snapshot·official_url), 구속력 단계(binding)만 담았습니다.
# 프롬프트 조립은 가드레일 에이전트 쪽 책임이고 이 파일의 관심사가 아닙니다.
#
# G01(신용카드 발급 경품 한도)은 여전법 시행령 제6조의7제5항제1호(2024-05-21 개정, 연회비의 100%)를
# 기준으로 합니다. 협회 세부지침 별표2 제재표의 '연회비 10% 초과'는 시행령 개정 전 기준이 남은 것으로 보고
# 근거로 쓰지 않았습니다.
items:
- code: A01
  group: A. 광고 공통 의무표시
  applies_to:
  - 신용카드
  - 단기카드대출
  - 장기카드대출
  - 리볼빙
  - 할부금융·리스
  page_types:
  - 상품광고
  - 업무광고
  applies_condition: null
  binding: 법령
  criterion: "카드사 광고는 계약을 체결하기 전에 상품설명서와 약관을 읽어볼 것을 권유하는 문구를 포함해야 합니다. 계약을 체결하기 전에 상품설명서와 약관을 읽어볼(확인할) 것을 권유하는 문구가 있는가?"
  sources:
  - doc: kfcpa
    loc: 제22조제3항제1호
    quote: "금융상품에 관한 계약을 체결하기 전에 금융상품 설명서 및 약관을 읽어 볼 것을 권유하는 내용"
    snapshot: 원문 스냅샷/kfcpa.txt
    official_url: https://www.law.go.kr/LSW/lsInfoR.do?lsiSeq=277247&chrClsCd=010202&urlMode=lsInfoP&efYd=20260102&ancYnChk=0
  - doc: crefia_reg
    loc: 제4조제1항제3호
    quote: "계약을 체결하기 전에 금융소비자에게 상품설명서와 약관을 읽어볼 것을 권유하는 내용"
    snapshot: 원문 스냅샷/crefia_reg.txt
    official_url: https://m.crefia.or.kr/mobile/infocenter/regulation/selfRegulation.xx
  - doc: crefia_guide
    loc: 별표1 1) 제1호
    quote: "계약을 체결하기 전에 금융상품설명서와 약관을 확인하시기 바랍니다."
    snapshot: 원문 스냅샷/crefia_guide.txt
    official_url: https://m.crefia.or.kr/mobile/infocenter/regulation/selfRegulation.xx
  - doc: fsc_ad_guideline
    loc: Ⅳ. 관련 법령 주요내용 2
    quote: "금소법령상 광고에 포함시키도록 규정된 사항 중 법률(금소법)에 규정된 사항*은 광고에서 제외할 수 없음을 유의"
    snapshot: 원문 스냅샷/fsc_ad_guideline.txt
    official_url: https://www.fsc.go.kr/no010101/76045
- code: A02
  group: A. 광고 공통 의무표시
  applies_to:
  - 신용카드
  - 단기카드대출
  - 장기카드대출
