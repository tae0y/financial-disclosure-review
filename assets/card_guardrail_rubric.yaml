- code: A08
  group: A. 광고 공통 의무표시
  applies_to:
  - 신용카드
  - 단기카드대출
  - 장기카드대출
  - 리볼빙
  - 할부금융·리스
  page_types:
  - 상품광고
  - 업무광고
  applies_condition: 협회 심의 대상 광고는 심의필 유효기간 표시가 요구됩니다(유효기간 표시가 곤란하면 '유효한 현재 시점' 표시 허용).
  binding: 법령
  criterion: "협회 심의 대상 광고는 광고 또는 심의필의 유효기간을 표시해야 합니다. 광고 또는 심의필의 유효기간이 표시되어 있는가?"
  sources:
  - doc: fsc_rule_app5
    loc: 제1호가목
    quote: "가. 광고의 유효기간이 있는 경우 해당 유효기간"
    snapshot: 원문 스냅샷/fsc_rule_app5.txt
    official_url: https://www.law.go.kr/LSW/flDownload.do?flSeq=163377581
  - doc: crefia_reg
    loc: 제4조제1항제7호
    quote: "광고 유효기간이 있는 경우 해당 유효기간"
    snapshot: 원문 스냅샷/crefia_reg.txt
    official_url: https://m.crefia.or.kr/mobile/infocenter/regulation/selfRegulation.xx
  - doc: crefia_reg
    loc: 제11조제1항
    quote: "여신금융회사 등은 협회가 적격 또는 조건부 적격으로 광고 심의결과를 통보함에 따라 부여된 광고 심의결과의 유효기간을 표시하여야 한다."
    snapshot: 원문 스냅샷/crefia_reg.txt
    official_url: https://m.crefia.or.kr/mobile/infocenter/regulation/selfRegulation.xx
