# 사례별 리스크 유형 큐레이션 — `case_corpus.yaml`의 40건 case_id를 고정 어휘 3종
# (rate_fee | benefit_condition | warning_penalty)에 매핑합니다.
#
# `case_corpus.yaml` 자체는 바꾸지 않습니다 — 바꾸면 임베딩 재빌드(유료)가 필요합니다.
# 이 파일은 순수 색인용 메타데이터이며 `knowledge/reference.py`가 카드의 리스크 유형과
# 겹치는 사례에 가산점(boost)을 줄 때만 읽습니다. product_type 필터는 여전히
# `case_product_types` 테이블(하드 필터)에서 옵니다 — 이 파일은 랭킹에만 씁니다.
#
# 리스크 유형 정의
#   rate_fee          금리·이자율·수수료·연회비
#   benefit_condition 혜택·자격·조건·예외(무이자, 포인트, 할인, 대출자격 등)
#   warning_penalty   경고·불이익·연체·신용평점 하락
#
# text_verified: false인 항목은 원문이 축자 대조되지 않았습니다(케이스 코퍼스 헤더 주석 참고).
# 그 경우 사례 인용(case_quote)은 항상 비워 두고 "원문 재확인 필요" 메모를 답니다.
