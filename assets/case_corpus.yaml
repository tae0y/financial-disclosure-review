    텔레마케팅을 통한 신용카드 부가서비스 가입 관련 분쟁
    ▣ 민원내용
    신청인은 신용카드 가입시 텔레마케팅(TM) 상담원이 자동차관리 부가서비스 가입을 권유하여 무료로 생각하고 가입하였으나, 최근 신용카드 청구서에 자동차관리 부가서비스에 대한 비용(월 9,900원)이 매달 청구되고 있는 것을 발견하고 환불을 요구
    ▣ 쟁점
    텔레마케팅(TM)을 통한 신용카드 부가서비스 가입절차가 적법했는지 여부
    ▣ 처리결과
    가입 당시 상담원이 민원인의 "광고죠?"라는 질문에 "광고가 아니며, 쿠폰을 사용해 보시라고 연락드렸다"고 답하였는데, 이는 방문판매법상 금지 행위 등에 해당할 여지가 있어 금융회사가 서비스 해지 및 전액 환불
    ▣ 소비자 유의사항
    TM으로 부가 서비스 가입시 해당 서비스의 결제액, 주기, 제공서비스 등을 꼼꼼히 확인하고 신중하게 가입할 필요가 있으며, 가입 이후에도 정기결제 가입한 사실을 장기간 인지하지 못하고 비용을 납부하는 경우도 있으니 주기적으로 카드대금명세서를 확인할 필요가 있다. 녹취 기록 등을 통해 유료여부 등을 포함하여 금융회사의 상품설명이 적절히 이루어진 사실이 확인되는 경우 비용 환불 등이 제한될 수 있다.
