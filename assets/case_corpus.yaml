  mvp_signal: '''48만원 할인''·''무료구매찬스'' 같은 큰 글자 문구, 할부거래 여부·이용실적조건·할부수수료·연회비의 표시 크기와 위치'
  page_only_detectability: full
  related_checklist:
  - D06
  - D09
  - D14
  - E01
  - 표시02
  text: |
    (조사 배경) 통신사 대리점은 24 개월 간 특정 조건 충족 시 매월 2만원씩 신용 카드 대금이 할인청구 되는 것을 '최대 48 만원 할인' 등으로 광고. 할인을 받기 위한 ①신용카드 이용실적 ②연회비, ③할부수수료를 고려할 때 실질적으로 소비자가 받는 할인혜택은 48 만원에 크게 미달할 것으로 판단.
    (신용카드 제휴할인 광고 현황) 통신사 대리점 100 곳 중 통신단말기 신용카드 제휴 할인에 대한 옥외 광고물을 설치한 곳은 48 곳(48%)으로 나타나 이를 중심으로 조사. 제휴카드의 최대 할인금액 등 소비자에게 유리한 정보는 매우 큰 글자로 강조되어 있는 반면, 소비자에게 불리한 네 가지 중요 정보(①즉시 할인인지 할부결제인지, ②이용실적조건이 있는지, ③할부수수료가 있는지, ④연회비가 있는지)는 누락되거나 매우 작은 글씨로 표시되어 정보 제공이 미흡했음.
    (LGU+ 옥외광고 종류별 내용) 1 종의 광고가 있었으며 '무료구매찬스'가 큰 글자로, '실 구매가 0원'이 적색 음영으로 강조되어 있었음. ①'무료구매찬스'라는 글자가 붉은색에 매우 큰 글자로 표시되어 있고, 우측 하단에 '실 구매가 0원'이라고 표시됨 - 할부거래여부: 좌측 하단 작은 글자로 표시(은폐) - 이용실적조건: 좌측 하단 작은 글자로 표시(은폐) - 할부수수료: 누락 - 연회비: 누락.
    (통신사 대리점 옥외 광고의 기만성) 위 중요 정보를 은폐·누락·축소하고 있어, 기만성 있는 광고인 것으로 추정. 따라서 통신사 대리점 옥외광고는 기만성, 오인성, 공정거래저해성이 있어 표시·광고법상 금지하는 기만적인 표시·광고에 해당할 것으로 추정.
    (개선방안) '무료구매찬스', '부담제로'와 같은 표현은 사실과 다소 다르고 소비자의 과소비를 유도하기 때문에 삭제할 필요. 48 만원 즉시할인이 아닌 할부결제 후 조건부 청구 할인이라는 사실, 이용실적조건, 할부수수료, 연회비는 소비자의 구매 결정에 중요한 정보이므로 표시를 강화할 필요.
