  source_tier: 1
  product_types:
  - 신용카드
  product_basis: 유추
  product_subtype: 통신단말기 제휴 신용카드 할인 광고
  legal_basis: 표시·광고의 공정화에 관한 법률 제3조, 기만적인 표시·광고 심사지침
  issue: 통신사 대리점 옥외광고가 '48만원 할인' 등을 큰 글자로 표시하면서 실제로는 할부결제·이용실적조건이며 할부수수료·연회비가 있다는 사실을 작은 글자로 표시하거나 누락해,
