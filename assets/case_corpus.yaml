  text: |
    신용카드사 채무면제·유예상품, 불완전판매 여전해 - 카드사의 부가상품 청구내역 알기 쉽게 개선하고, 불완전판매 관리·감독 강화해야- 신용카드사가 '보험'과 유사 한 채무면제·유예상품(DCDS)판매로 상당한 수익을 올리고 있지만 불완전판매로 인한 소비자불만은 여전한 것으로 나타났다. 특히 주된 가입 경로가 소비자의 자발적 신청이 아닌 텔레마케팅 방식을 통한 비대면 거래인 경우가 많아 소비자의 주의가 요구된다.
    한국소비자원(원장 한견표)이 최근 4 년간(2012~2015 년) 1372 소비자상담센터에 접수된 채무면제·유예상품 관련 소비자상담 544 건을 분석한 결과, 상품가입 동의의사 확인 미흡(273 건, 50.2%), 수수료 등 주요 거래조건 설명 미흡(83 건, 15.3%),무료서비스로 알았으나 수수료 부과(75 건, 13.8%) 등 '불완전판매 관련 불만'이 79.3%로 대부분 을 차지했다.
    금융감독원은 채무면제·유예상품 가입사실을 비롯하여 수수료, 보장내용 및 가입신 청 철회 등 고객의 권리 및 유의사항을 포함한 '핵심설명서'를 도입(2013.4.)하여, 신용카드사로 하여금 가입시점 뿐만 아니라 매년 1 회 이상 가입자에게 정기적으로 발송하고 문자메시지로도 간략하게 그 내용을 알려주도록 하였다. 이에 7 개 신용카드사의 '핵심 설명서'를 살펴 본 결과, 수수료, 보장내용은 대부분 기재되어 있는 반면, '고객의 권리 및 유의 사항'과 관련한 내용은 미흡하여 개선이 필요한 것으로 나타났다.
    이를 구체적으로 살펴보면, '가입신청 철회(30 일 이내)와 불완전판매를 이유로 한 계약 취소(3 개월 이내) 가능' 표시 3 개사, '회원이 일정 연령(예:만 61 세) 도달 시 카드사의 직권해지 관련 사항'과 '계 약 전 고객의 알릴 의무(기왕증 등) 위반 시 보상에서 제외됨' 표시 각각 1 개사, '수수료가 소멸되는지 등 수수료 환급 여부'에 대해 표시한 곳은 2 개사에 불과하였다.
