  official_date: '2024-02-26'
  official_primary_url: https://www.fss.or.kr/fss/bbs/B0000188/view.do?nttId=134078&menuNo=200218
  source_tier: 1
  product_types:
  - 리볼빙
  product_basis: 직접
  product_subtype: 결제성 리볼빙
  legal_basis: 금융소비자보호법 제19조, 여신전문금융회사 등의 광고에 관한 규정 세부지침(표시방법), 금감원·여신금융협회 공동 개선방안
