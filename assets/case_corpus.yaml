  text: |
    투자금 할부거래에 대한 할부항변권 제한 사례
    ▣ 민원내용
    민원인은 창업 지원, 수수료 수취 등을 위해 가맹점에 신용카드 할부로 투자금을 결제하였는데 가맹점의 약속 불이행 등을 이유로 「할부거래에 관한 법률」(이하 '할부거래법') 제16조에 따른 소비자의 항변권을 행사하고자 하였으나, 신용카드사가 이를 수용하지 않아 민원을 제기
    ▣ 쟁점
    할부거래법 제2조제5호가목에서 소비자란 '할부계약 또는 선불식 할부계약에 의하여 제공되는 재화 등을 소비생활을 위하여 사용하거나 이용하는 자'라고 정하고 있는데, 본건과 같이 창업 지원, 수수료 수취 등을 위한 할부거래계약의 경우에도 소비자의 항변권 적용이 가능한지 여부
    ▣ 처리결과
    본건 할부거래계약이 일정한 수익을 지급받기 위한 영리 목적으로 체결되었음을 감안할 때 민원인이 할부거래법에서 정하는 '소비자'에 해당되는 것으로 보기 어렵고, 이에 따라 할부거래법에서 정하는 할부항변권 대상에 해당되지 않는 것으로 판단되어 민원인의 주장은 수용 불가
    ▣ 소비자 유의사항
    신용카드 할부결제로 투자금 납입시 고율의 수익(수당, 수수료 등)을 지급하는 형태의 계약은 가맹점의 채무 불이행이 발생할 경우에도 영리목적의 거래로 할부항변권 행사가 제한될 수 있으며, 신용카드사가 해당 매출을 임의로 취소할 수 없으므로 사전에 유의할 필요
