  text: |
    주문: 피심인은 여행·가전 결합상품을 판매하면서 소비자가 할부계약을 통해 구매해야 하는
    가전상품을 무료로 제공하는 것처럼 소비자를 속이거나 소비자로 하여금 잘못 알게 할 우려가
    있는 거짓·과장의 광고행위를 즉시 중지하여야 하고, 이와 같은 행위를 다시 하여서는 아니 된다.
    행위사실: 피심인은 2021년 7월 중순경부터 같은 해 9월 초순경까지 여행·가전 결합상품인
    '리시스 598' 및 '리시스 897'의 판매를 위한 광고를 하면서, 모바일 어플리케이션 '카카오톡'
    및 제3자의 블로그를 통해 '삼성/LG 노트북 제공', '최신 가전제품을 공짜로 가져가세요!',
    '최신 가전 + 무료숙박권 10회 바로 지급!'과 같은 표현을 포함한 광고를 한 사실이 있다.
    위법성 판단(거짓·과장성): 피심인은 자신의 여행·가전 결합상품을 구입하는 소비자들에게
    노트북 등 가전상품을 무상으로 제공하지 아니하고, 별도의 할부계약 체결을 통해 가전상품
    대금을 부담하도록 하였다. 따라서 이 사건 광고는 사실과 다르거나 사실을 지나치게 부풀린
    것으로 거짓·과장성이 인정된다.
    위법성 판단(소비자오인성): 이 사건 광고를 접하는 보통의 주의력을 가진 일반적인
    소비자들은 피심인의 여행·가전 결합상품을 구입하는 경우, 아무런 비용 지불 없이 노트북을
    제공받을 수 있는 것처럼 오인하거나 오인할 우려가 있다고 할 것이다. 또한 피심인이 이
    사건 광고와 관련된 가전상품을 할부로 구매해야 된다는 사실을 소비자와의 계약체결 과정에
    이르러 유선 통화로 안내하였더라도, 이러한 사실이 이 사건 광고의 오인성에 대한 판단에
    영향을 미치지 않는다.
