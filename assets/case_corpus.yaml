  text: |
    ( 통신 단말기 할인서비스 중요정보 제공 미흡 ) 7 개 신용카드사의 18 개 통신사 제휴 신용카드의 '3 가지 중요 정보'에 대한 표시·광고 실태를 분석한 결과, 첫 페이지에 해당 정보를 제공한 경우는 54 곳 중 30 곳(55.6%).
    (할부이자 표시 미흡) 18 개 제휴 신용카드 중 9개(50%)가 할부이자를 첫 페이지에 표시하지 않고 있어 정보제공이 미흡하였으며, 삼성카드사의 3개 신용카드에서는 할부이자를 확인하기 위해 추가적으로 두 차례 정확한 클릭이 필요한 것으로 나타남.
    (필요 이용 실적 표시 미흡) 18 개 제휴 신용카드 중 11 개(61.1%)가 할인서비스를 받기 위한 이용실적을 첫 페이지 표시하지 않고 있어 정보제공이 미흡하였고, 삼성카드, 국민카드, 현대카드 3 개사 9개 카드에서는 이용실적 정보를 확인하기 위해 추가적으로 두 차례 정확한 클릭이 필요한 것으로 나타남.
    (연회비 표시 일부 미흡) 18 개 제휴 신용카드 중 4개(22.2%)가 신용카드 연회비를 첫 페이지에 표시하지 않고 있는 것으로 나타남. 삼성카드와 롯데카드는 3가지 항목 중 1페이지에 표시된 항목이 한 건도 없었으며, 신한카드와 우리카드는 3가지 항목이 표시되어 있어 가장 양호하였음.
