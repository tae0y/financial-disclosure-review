    주문: 피심인은 대출상품에 대하여 광고하면서 자신이 고객들에게 실제로 부여하는 무이자 기간보다
    장기간 무이자 기간을 부여하는 것처럼 소비자를 속이거나 소비자로 하여금 잘못 알게 할 우려가
    있는 허위·과장의 광고행위를 다시 하여서는 아니 된다.
    광고내용: '무이자 30일 맞습니다 / 한 달 동안 / 무이자 30일 / 한달간 이자가 공짜'. 무이자 30일
    이벤트 대상은 '신규고객에 한함'으로 자막으로만 제공.
    행위사실: 그러나 실제 피심인은 이 사건 광고기간 동안 대부계약을 신규로 체결하면서 고객의
    신용도에 따라 무이자 기간을 차등하여 부여하였다. 무이자 기간 15일이 28,402건(91.4%),
    30일이 2,664건(8.6%)이었다.
