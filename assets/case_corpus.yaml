  text: |
    사업자의 온라인 광고 서비스 계약에 대한 할부항변권 행사 관련 분쟁
    ▣ 민원내용
    민원인(사업자)은 소상공인을 위한 온라인 SNS 광고 등을 대행하는 가맹점과 온라인광고 서비스 계약을 체결하면서 동 대금을 신용카드 할부로 결제함. 그 후 민원인은 가맹점의 약속 불이행 등을 이유로 신용카드사에「할부거래에 관한 법률」(이하 '할부거래법') 제16조에 따른 소비자의 항변권을 행사하고자 하였으나, 카드사가 이를 수용하지 않아 민원을 제기
    ▣ 쟁점
    할부거래법 제2조제5호가목에서 소비자란 '할부계약 또는 선불식 할부계약에 의하여 제공되는 재화 등을 소비생활을 위하여 사용하거나 이용하는 자'라고 정하고 있는데, 본건과 같이 사업자의 사업장 홍보, 광고 등을 위한 할부거래계약의 경우에도 소비자의 항변권 적용이 가능한지 여부
    ▣ 처리결과
    민원인이 사업자로서, 광고대행업자인 가맹점과 영업행위를 위한 광고 서비스 계약을 체결하였음을 감안할 때, 동 할부 거래는 '사업자가 상행위를 위하여 재화등의 공급을 받는 거래'에 해당하는바, 할부거래법 제3조(적용제외)에 해당되어 동법 제8조(청약의 철회) 및 제16조(소비자의 항변권) 적용 대상에 해당되지 않는 것으로 판단되어 민원인의 주장은 수용 불가
    ▣ 소비자 유의사항
    신용카드 할부결제로 온라인 광고에 대한 계약금을 지불한 경우는 상행위에 해당되어 할부항변권 행사가 제한될 수 있으며, 신용카드사가 해당 매출을 임의로 취소할 수 없으므로 사전에 유의할 필요
  text_sha256: 09ba109e8dd86cc81f61b8f6a590492dc797e1fd44899031ad65133fb56837f2
