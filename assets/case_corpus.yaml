  text: |
    신용카드‘부가 서비스(상품)’불이행 피해 많아 - 부가 서비스(상품) 가입 전 조건, 서비스 내용 등 정확히 확인해야 - 신용카드 제휴카드 할인, 캐시백, 적립, 채무면제·유예상품, 리볼빙 등의 부가 서비스(상품)(이하 '부가서비스'라 함)를 이행해주지 않는 사례가 많아 소비자들의 주의가 요구된다. 한국소비자원(원장 한견표)에 따르면, 신용카드 관련피해구제는 2014년 1월부터 2016년 9월까지 총 263건이 접수되었으며, 2016년에는 9월까지 111건이 접수되어 전년도 같은 기간에 비해 141.3% 증가한 것으로 나타났다.
    피해구제 접수된 263건을 분석한 결과, 신용카드 부가서비스를 제대로 이행하지 않거나 설명해주지 않는 등의 '부가서비스 관련' 피해가 31.6%(83건)로 가장 많았고, 미사용 또는 과다 대금 청구 등 '부당한 대금 청구'가 20.5%(54건)였다. '부가서비스 관련' 피해(83건)는 채무면제·유예, 제휴할인, 캐시백, 적립, 리볼빙 등의 신용카드 부가서비스를 이행하지 않아 발생한 피해가 21.7%(57건)였고, 부가서비스 가입 과정에서의 설명 미흡 관련이 9.9%(26건)였다.
    [사례1] 학원비 제휴할인 서비스 이행 요구 유모씨(여, 40대)는 월 60만 원 이상 사용하면 학원비 결제 시 10% 할인받는 조건으로 A신용카드를 발급받음. 월 이용실적을 채우고 밸리댄스 학원에서 학원비 20만 원을 결제하였으나 카드대금이 할인되지 않아 A카드사에 시정을 요구였으나 거부함.
    [사례2] 무료라고 안내받은 채무면제·유예상품 수수료 환급 요구 김모씨(남)는 2012년에 B신용카드 상담원으로부터 우수고객 대상으로 가입비 등 별도 비용이 없고 신용카드를 많이 쓸수록 혜택이 있다는 설명을 듣고 상품에 가입함. 2015년 11월 B신용카드 결제내역을 확인하는 과정에서 채무면제·유예상품 명목으로 대금이 결제된 내역을 발견하고, 그 동안 인출된 75만 원 전액 환급을 요구하였으나 거부함.
  text_sha256: 96448e1006bc432ca5a0f17415bfb1d9ad3fb6d269d72e6305aa3da97f35e82b
