# 카드사 표시광고·설명의무 제재·지적 사례 코퍼스 (19건)
#
# 루브릭(card_guardrail_rubric.yaml, plain_service_rubric.yaml)과 같은 신뢰 경계에 둡니다.
# 루브릭이 "무엇을 지켜야 하는가"를 담는다면 이 파일은 "실제로 무엇이 문제가 되었는가"를 담고,
# `related_checklist`로 두 파일을 잇습니다. 항목마다 공식 1차 출처 URL이 반드시 있어야 하고
# (루브릭 `sources[].official_url` 원칙과 같습니다), `text`는 그 출처 원문에서 가져온 문장입니다.
#
# 상품유형 공백에 대하여: 금소법 시행(2021-03-25) 이후 카드사의 표시광고(제22조)·설명의무(제19조)
# 위반으로 분류된 금감원 공식 제재는 선행 조사에서 카드·캐피탈 44건 전수 확인 결과 0건이었습니다
# (`관련자료/260917 카드론·손해보험 표시광고·설명의무 위반 제재사례 조사.md`). 그래서 이 코퍼스는
# 제재(위반사례)에 한정하지 않고 감독당국·협회가 공표한 지적사례·민원사례까지 포함합니다.
# `product_basis`가 `유추`인 항목은 제재 대상이 카드 상품이 아니라 같은 광고 유형을 가진 다른
# 업권(대부업 등)이라는 뜻입니다 — 판정 근거로 인용할 때 이 점을 밝혀야 합니다.
#
# `text`는 출처 원문만 담습니다 — 이 코퍼스의 주석은 넣지 않습니다(임베딩 대상이라 벡터가 흐려집니다).
# 그래서 두 가지 유보사항을 여기에 적어 둡니다.
#   - 여신금융협회 `case.crefia_ad_type_*` 5건은 게시일이 없는 상시 안내 페이지에서 가져왔습니다.
#     `official_date`는 이 코퍼스가 페이지를 확인한 날짜이며 사건 발생일이 아닙니다.
#   - `case.fss_20260609_revolving_complaint`의 본문 인용문은 게시물이 동적 로딩이라 선행 조사에서도
#     축자 대조되지 않았습니다. 제목·URL 존재만 확인된 상태이므로 판정 근거로 인용할 때는 원문을
#     다시 확인해야 합니다.
#
# 리스(시설대여) 단독 표시광고 사례는 공정위 의결서 전수검색(부당한 표시광고 유형), 금감원
# 보도자료, 한국소비자원 보고서에서 모두 확인되지 않았습니다. `할부금융·리스`는 할부금융 쪽
# 사례로만 채워져 있습니다.
#
# 필드
#   case_id                 안정적인 식별자
#   record_type             위반사례(제재) | 지적사례(감독당국 점검·개선요구) | 민원사례
#   institution / firm      처분·공표 기관 / 대상 회사(비공개면 not_disclosed)
#   official_date           처분일 또는 공표일
#   official_primary_url    공식 1차 출처 URL
#   source_tier             1=공식 1차, 2=공식 문서의 2차 게재, 3=언론·민간 재게시
#   product_types           이 사례가 알려주는 프로젝트 상품유형(루브릭 applies_to와 같은 값)
#   product_basis           직접(제재 대상이 그 상품유형) | 유추(같은 광고 유형의 다른 업권·상품)
#   product_subtype         사례에 나온 실제 상품
#   legal_basis             당시 적용된 법령·규정
#   issue                   무엇이 문제였는지 한 문장
#   outcome                 조치 결과
#   mvp_signal              상품 페이지에서 찾아야 할 신호
#   page_only_detectability full | partial | review_required | out_of_scope
#   related_checklist       관련 루브릭 코드
#   text                    임베딩·인용에 쓰는 출처 원문 문장
#   retrieved_at            원문을 확인한 날짜
items:

# ── 리볼빙 ─ 금융감독원·여신금융협회 공동 리볼빙 광고 점검 (2024-02-26) ──────────────
- case_id: case.fss_20240226_revolving_min_rate_only
  record_type: 지적사례
  institution: 금융감독원
  firm: not_disclosed
  official_date: '2024-02-26'
  official_primary_url: https://www.fss.or.kr/fss/bbs/B0000188/view.do?nttId=134078&menuNo=200218
  source_tier: 1
  product_types:
  - 리볼빙
  product_basis: 직접
  product_subtype: 결제성 리볼빙
  legal_basis: 금융소비자보호법 제22조, 금융소비자보호 감독규정 제17조(금감원·여신금융협회 공동 개선방안)
  issue: 리볼빙 광고가 평균이자율 없이 최소~최대 범위만 안내하고, 일부 카드사는 첫 화면에 일반 소비자가 적용받기 어려운 최소이자율만 표기했습니다.
  outcome: 개선방안 시행(평균 이자율 병행 고지)
  mvp_signal: 첫 화면의 이자율 표기, 최소이자율 단독 노출, 평균 이자율 병행 여부, 최고이자율의 위치와 크기
  page_only_detectability: full
  related_checklist:
  - C03
  - D01
  - E08
  - 표시09
  text: |
    (현행) 각 카드사 홈페이지·앱 등의 리볼빙 광고에는 평균 이자율('24.1월말 16.9%) 언급 없이
    최소 및 최대 이자율 범위만 안내. 특히 일부 카드사는 광고 첫 화면에 일반 금융소비자가
    적용받기 어려운 최소이자율만 표기하여 소비자의 올바른 의사결정을 저해(예: 극히 예외적으로
    적용받는 최소이자율인 5.4%만 광고 첫 화면에 게시 등). 카드사 홈페이지 리볼빙 이자율
    고시는 A사 연 6.9~19.95%, B사 연 4.5~19.9%, C사 연 5.4~19.9%, D사 연 5.6~19.95%였으나
    실제 평균 이자율은 16.9%였다.
    (개선) 홈페이지 및 앱 광고 등에 리볼빙 적용이자율을 고시할 때는 최소·최대 범위뿐만 아니라
    평균 이자율도 병행하여 기재.
  retrieved_at: '2026-09-27'

- case_id: case.fss_20240226_revolving_tab_naming
  record_type: 지적사례
  institution: 금융감독원
  firm: not_disclosed
  official_date: '2024-02-26'
  official_primary_url: https://www.fss.or.kr/fss/bbs/B0000188/view.do?nttId=134078&menuNo=200218
  source_tier: 1
  product_types:
  - 리볼빙
  product_basis: 직접
  product_subtype: 결제성 리볼빙
  legal_basis: 금융소비자보호법 제22조, 신용카드 개인회원 표준약관(용어), 금감원·여신금융협회 공동 개선방안
  issue: 결제화면에서 리볼빙임을 밝히지 않고 '일부만 결제'·'최소결제' 같은 탭 이름을 써서 일시불 분할납부 등 다른 서비스로 오인할 수 있게 했습니다.
  outcome: 개선방안 시행('리볼빙' 또는 '일부결제금액이월약정(리볼빙)'으로 명확히 표기)
  mvp_signal: 가입·결제 화면의 탭·버튼 이름, '일부 결제'·'최소결제'·'미납 걱정없이 결제' 같은 표현, 정식 상품명 표기 여부
  page_only_detectability: full
  related_checklist:
  - A03
  - D05
  - F02
  text: |
    (현행) 일부 카드사는 홈페이지 또는 앱 결제화면에 리볼빙임을 밝히지 않고 「일부만 결제」
    또는 「최소결제」라는 탭을 운용((A사) 「일부 결제 후 이월」 / (B사) 「일부 결제」 /
    (C사) 「미납 걱정없이 결제」 탭 운용). 이로 인해 소비자는 당월에 일부금액만 결제할 수 있는
    '일시불 분할납부' 등 다른 서비스와 오인 가능.
    (개선) 앱이나 홈페이지의 리볼빙 가입화면에 '최소결제', '일부만 결제' 등 소비자 오인
    가능성이 있는 표현 대신, 소비자에게 익숙한 '리볼빙' 또는 표준약관상 용어인
    '일부결제금액이월약정(리볼빙)'으로 분명하게 표기토록 개선.
  retrieved_at: '2026-09-27'

- case_id: case.fss_20240226_revolving_longterm_risk
  record_type: 지적사례
  institution: 금융감독원
  firm: not_disclosed
  official_date: '2024-02-26'
  official_primary_url: https://www.fss.or.kr/fss/bbs/B0000188/view.do?nttId=134078&menuNo=200218
  source_tier: 1
  product_types:
  - 리볼빙
  product_basis: 직접
  product_subtype: 결제성 리볼빙
  legal_basis: 금융소비자보호법 제19조, 금융소비자보호 감독규정 제13조, 금감원·여신금융협회 공동 개선방안
  issue: 리볼빙 신청과정 설명 자료가 신청 당월 1개월치만 제시하거나 이후 카드사용액을 0 또는 감소로 가정해, 청구금액이 점차 낮아지는 예시로 장기이용 위험을 감춰 설명했습니다.
  outcome: 개선방안 시행(3개월 이상·매달 카드사용액 일정 가정으로 설명)
  mvp_signal: 리볼빙 수수료 시뮬레이션의 가정과 기간, 2개월차 이후 카드사용액 가정값, 청구금액·이월금액 추이 방향
  page_only_detectability: full
  related_checklist:
  - F10
  - D02
  - 쉬운말12
  text: |
    (현행) 리볼빙은 장기간 이용할수록 결제부담이 확대되고 상환 불능 가능성도 증가하지만 이에
    대한 설명이 미흡. 특히 일부 카드사는 홈페이지의 리볼빙 '신청과정 설명 자료'에 실제 신용카드
    이용행태에 부합하지 않는 사례 위주로 설명(신청 당월(1개월치) 시뮬레이션 자료만 제시하거나,
    다음달 신용카드 사용액이 '0' 또는 감소하는 것으로 가정하여 설명하고, 리볼빙 이용 후
    청구금액(사용자 부담액)이 점차 낮아지는 예시를 활용). G사는 2개월차 이후 카드사용액을 '0'으로
    가정하여 설명, H사는 2개월차 이후 카드사용액 감소를 가정(100만원 → 20만원)하여 청구금액 및
    이월금액도 점차 감소하는 것으로 표기.
    (개선) 장기 사용(3개월 이상) 및 현실적인 카드이용 행태(예: 매달 카드사용액 일정)를 반영한
    자료로 설명.
  retrieved_at: '2026-09-27'

- case_id: case.fss_20240226_revolving_assertive_wording
  record_type: 지적사례
  institution: 금융감독원
  firm: not_disclosed
  official_date: '2024-02-26'
  official_primary_url: https://www.fss.or.kr/fss/bbs/B0000188/view.do?nttId=134078&menuNo=200218
  source_tier: 1
  product_types:
  - 리볼빙
  product_basis: 직접
  product_subtype: 결제성 리볼빙
  legal_basis: 금융소비자보호법 제22조제3항, 금융소비자보호 감독규정 제20조, 금감원·여신금융협회 공동 개선방안
  issue: 리볼빙을 개인신용평점 하락을 방지하는 결제 편의상품이라고 광고해, 특정 조건에서만 성립하는 사항을 항상 충족되는 일반적 사항처럼 단정했습니다.
  outcome: 개선방안 시행(단정적 표현 지양, 전제조건 병행 표기)
  mvp_signal: "'신용평점 하락 방지'·'결제 편의' 같은 단정적 표현, 그 표현의 전제조건 병기 여부, 개인신용평점 하락 가능성 경고문구"
  page_only_detectability: full
  related_checklist:
  - D04
  - F06
  - F18
  - A11
  text: |
    (현행) 일부 카드사는 리볼빙이 '개인신용평점 하락을 방지하는 결제 편의상품'이라 광고하는 등,
    특정조건(연체없이 지속결제, 매달 카드사용액 일정 등) 만족시 성립되는 사항을 리볼빙 이용 시
    항상 충족되는 일반적인 사항처럼 광고.
    (개선) 리볼빙 광고시 금융소비자의 합리적인 의사결정을 저해할 수 있는 단정적인 표현을
    사용하지 않도록 하고, 불가피하게 일부 사용할 경우 해당 문구가 성립하기 위한 전제 조건을
    반드시 병행하여 표기.
  retrieved_at: '2026-09-27'

- case_id: case.fss_20240226_revolving_total_fee_legibility
  record_type: 지적사례
  institution: 금융감독원
  firm: not_disclosed
  official_date: '2024-02-26'
  official_primary_url: https://www.fss.or.kr/fss/bbs/B0000188/view.do?nttId=134078&menuNo=200218
  source_tier: 1
  product_types:
  - 리볼빙
  product_basis: 직접
  product_subtype: 결제성 리볼빙
  legal_basis: 금융소비자보호법 제19조, 여신전문금융회사 등의 광고에 관한 규정 세부지침(표시방법), 금감원·여신금융협회 공동 개선방안
  issue: 리볼빙 예상 상환기간과 총수수료를 이용대금명세서 하단에 작은 글씨로 기재해 소비자가 명확히 인식하지 못할 우려가 있었습니다.
  outcome: 개선방안 시행(별도 항목으로 명확히 고지)
  mvp_signal: 예상 상환기간·총수수료의 글자 크기와 위치, 별도 항목 구분 여부, 혜택 문구와의 크기 대비
  page_only_detectability: partial
  related_checklist:
  - E01
  - E02
  - F04
  - 표시02
  - 표시03
  text: |
    (현행) 리볼빙 이용대금명세서(리볼빙 이용자 한정)에 리볼빙 예상 상환기간 및 총수수료를
    안내하고 있으나, 일부 카드사의 경우 리볼빙 예상 상환기간·(총수수료)를 이용대금명세서 하단에
    작은 글씨로 기재하여 소비자가 명확히 인식하지 못할 우려.
