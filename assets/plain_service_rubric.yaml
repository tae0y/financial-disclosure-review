  targets:
  - 쉬운말
  applies_condition: null
  binding: 자체 설계
  criterion: "쉬운말 화면은 '이해를 돕기 위한 설명이며 계약 내용은 상품설명서·약관을 따른다'는 안내를 포함해야 하고, 한 번에 원문으로 돌아갈 수 있어야 하며, 원문의 의무표시사항이 계속 보여야 합니다. 쉬운말 화면에 '이해를 돕기 위한 설명이며 계약 내용은 상품설명서·약관을 따른다'는 안내가 있고, 한 번에 원문으로 돌아갈 수 있으며, 원문의 의무표시사항이 계속 보이는가?"
  sources:
  - doc: kfcpa
    loc: 제19조제2항
    quote: "제1항에 따른 설명에 필요한 설명서를 일반금융소비자에게 제공하여야 하며,"
    snapshot: 원문 스냅샷/kfcpa.txt
    official_url: https://www.law.go.kr/LSW/lsInfoR.do?lsiSeq=277247&chrClsCd=010202&urlMode=lsInfoP&efYd=20260102&ancYnChk=0
  - doc: kfcpa
    loc: 제22조제3항제1호
    quote: "금융상품에 관한 계약을 체결하기 전에 금융상품 설명서 및 약관을 읽어 볼 것을 권유하는 내용"
    snapshot: 원문 스냅샷/kfcpa.txt
    official_url: https://www.law.go.kr/LSW/lsInfoR.do?lsiSeq=277247&chrClsCd=010202&urlMode=lsInfoP&efYd=20260102&ancYnChk=0
  - doc: fsc_online_explain
    loc: 원칙5 원칙의 내용
    quote: "금융상품판매업자등이 제공하는 금융상품 설명 보조수단은 금융 소비자가 쉽고 편리하게 접근하고 이용할 수 있도록 합니다."
    snapshot: 원문 스냅샷/fsc_online_explain.txt
    official_url: https://www.fsc.go.kr/no010101/78276
- code: 쉬운말19
  group: 쉬운말서비스
  applies_to:
  - 신용카드
