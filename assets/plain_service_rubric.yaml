  - doc: kfcpa_decree
    loc: 제19조제1항
    quote: "금융소비자가 광고의 내용을 쉽게 이해할 수 있도록 광고의 글자, 영상 및 음성 등 전달방법에 관하여 금융위원회가 정하여 고시하는 기준을 준수해야 한다."
    snapshot: 원문 스냅샷/kfcpa_decree.txt
    official_url: https://www.law.go.kr/LSW/lsInfoR.do?lsiSeq=285715&chrClsCd=010202&urlMode=lsInfoP&efYd=20260428&ancYnChk=0
  - doc: fsc_rule
    loc: 제18조
    quote: "광고에서 글자의 색깔ㆍ크기 또는 음성의 속도ㆍ크기 등이 해당 금융상품으로 인해 금융소비자가 받을 수 있는 혜택과 불이익을 균형 있게 전달할 것을 말한다."
    snapshot: 원문 스냅샷/fsc_rule.txt
    official_url: https://www.law.go.kr/LSW/admRulInfoR.do?admRulSeq=2100000276850&chrClsCd=010201
  - doc: crefia_reg
    loc: 제6조제1항
    quote: "광고에서 글자의 색깔ㆍ크기 또는 음성의 속도ㆍ크기 등은 금융소비자가 받을 수 있는 혜택과 불이익을 균형 있게 전달하여야 한다."
    snapshot: 원문 스냅샷/crefia_reg.txt
    official_url: https://m.crefia.or.kr/mobile/infocenter/regulation/selfRegulation.xx
  - doc: crefia_guide
    loc: 별표3 제2호(2)③
    quote: "광고주가 주장하는 주요 혜택를 강조하는 만큼 불리한 정보도 유사하게 제공하여 금융소비자로 하여금 현명한 선택을 할 수 있게 도와야 함"
    snapshot: 원문 스냅샷/crefia_guide.txt
    official_url: https://m.crefia.or.kr/mobile/infocenter/regulation/selfRegulation.xx
