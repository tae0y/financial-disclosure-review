  targets:
  - 쉬운말
  applies_condition: 쉬운말을 미리 만들어 공개 상품 페이지에 게시하는 경우. 소비자가 개별적으로 요청할 때마다 생성해 답하는 방식이면 협회 세부지침 제2조제4호가목(개별 질의 답변)에 따라 광고에서 제외될 수 있으므로 준법감시인과 해석을 확정한 뒤 적용.
  binding: 법령
  criterion: "미리 만들어 공개 상품 페이지에 게시하는 쉬운말 문구는 공개 전에 준법감시인 심의를 거쳐야 하고, 협회 심의 대상 광고라면 협회 심의 범위에 포함되어야 합니다. 미리 만들어 게시하는 쉬운말 문구가 공개 전에 준법감시인 심의를 거쳤고, 협회 심의 대상 광고라면 협회 심의 범위에 포함되었는가?"
  sources:
  - doc: kfcpa_decree
    loc: 제19조제2항
    quote: "준법감시인(준법감시인이 없는 경우에는 감사를 말한다)의 심의를 받아야 한다."
    snapshot: 원문 스냅샷/kfcpa_decree.txt
    official_url: https://www.law.go.kr/LSW/lsInfoR.do?lsiSeq=285715&chrClsCd=010202&urlMode=lsInfoP&efYd=20260428&ancYnChk=0
  - doc: crefia_reg
    loc: 제7조제1항
    quote: "여신금융회사 등은 모든 광고에 대하여 사전에 준법감시인(준법감시인이 없는 경우에는 감사 또는 감사위원회를 말한다)으로부터 관련 법규와 이 규정 및 세부지침에 적합한지를 확인받아야 한다."
    snapshot: 원문 스냅샷/crefia_reg.txt
    official_url: https://m.crefia.or.kr/mobile/infocenter/regulation/selfRegulation.xx
  - doc: crefia_reg
    loc: 제8조제1항
    quote: "여신금융회사 등은 협회심의대상광고에 대하여 사전에 준법감시인의 심의 후 협회의 심의를 받아야 한다."
    snapshot: 원문 스냅샷/crefia_reg.txt
    official_url: https://m.crefia.or.kr/mobile/infocenter/regulation/selfRegulation.xx
  - doc: crefia_reg
    loc: 제25조
    quote: "향후 여신금융상품 광고와 관련하여 발생하는 모든 법적 책임은 해당 여신금융회사 등에 있다."
    snapshot: 원문 스냅샷/crefia_reg.txt
    official_url: https://m.crefia.or.kr/mobile/infocenter/regulation/selfRegulation.xx
  - doc: crefia_guide
    loc: 제2조제4호가목
    quote: "인터넷 홈페이지, 챗봇 등에서 개별 금융소비자의 질의에 대해 답변하는 경우."
    snapshot: 원문 스냅샷/crefia_guide.txt
    official_url: https://m.crefia.or.kr/mobile/infocenter/regulation/selfRegulation.xx
